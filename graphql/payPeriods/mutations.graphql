extend type Mutation {
  createPayPeriod(input: PayPeriodInput! @spread): PayPeriod
    @guard(with: ["api"])
    @create(model: "App\\Models\\PayPeriod")
    @injectAuthCompany

  updatePayPeriod(input: PayPeriodUpdateInput! @spread): PayPeriod
    @guard(with: ["api"])
    @update(model: "App\\Models\\PayPeriod")
    @whereAuthCompany

  deletePayPeriod(id: ID!): PayPeriod
    @guard(with: ["api"])
    @delete(model: "App\\Models\\PayPeriod")
    @whereAuthCompany
}