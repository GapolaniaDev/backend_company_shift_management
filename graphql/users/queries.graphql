extend type Query {
  user(id: ID! @eq): User
    @guard(with: ["api"])
    @can(ability: "view", find: "id")
    @find

  me: User
    @guard(with: ["api"])
    @auth

  # Profile specific queries
  profile: User
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Queries\\ProfileQuery@profile")
    
  profileWithEmployee: User
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Queries\\ProfileQuery@profileWithEmployee")
}