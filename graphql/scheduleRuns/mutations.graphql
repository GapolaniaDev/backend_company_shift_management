extend type Mutation {
  createScheduleRun(input: ScheduleRunInput! @spread): ScheduleRun
    @guard(with: ["api"])
    @create(model: "App\\Models\\ScheduleRun")

  updateScheduleRun(input: ScheduleRunUpdateInput! @spread): ScheduleRun
    @guard(with: ["api"])
    @update(model: "App\\Models\\ScheduleRun")

  deleteScheduleRun(id: ID!): ScheduleRun
    @guard(with: ["api"])
    @delete(model: "App\\Models\\ScheduleRun")
}