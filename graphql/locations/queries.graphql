extend type Query {
  location(id: ID! @eq): Location
    @guard(with: ["api"])
    @find(model: "App\\Models\\Location")

  locations(
    orderBy: [OrderByClause!] @orderBy
    name: String @where(operator: "like")
    is_active: Boolean @eq
    ids: [ID!]
    first: Int! = 25
    page: Int
  ): LocationPaginator!
    @guard(with: ["api"])
    @field(resolver: "App\\GraphQL\\Resolvers\\LocationResolver@locations")
}