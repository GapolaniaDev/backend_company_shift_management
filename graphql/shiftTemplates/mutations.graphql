extend type Mutation {
  createShiftTemplate(input: ShiftTemplateInput! @spread): ShiftTemplate
    @guard(with: ["api"])
    @create(model: "App\\Models\\ShiftTemplate")

  updateShiftTemplate(input: ShiftTemplateUpdateInput! @spread): ShiftTemplate
    @guard(with: ["api"])
    @update(model: "App\\Models\\ShiftTemplate")

  deleteShiftTemplate(id: ID!): ShiftTemplate
    @guard(with: ["api"])
    @delete(model: "App\\Models\\ShiftTemplate")
}