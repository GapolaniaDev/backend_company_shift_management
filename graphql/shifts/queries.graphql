extend type Query {
  shift(id: ID! @eq): Shift
    @guard(with: ["api"])
    @can(ability: "view", find: "id")
    @find

  shifts(
    filter: ShiftFilterInput @spread
    orderBy: [OrderByClause!] @orderBy
    first: Int
    page: Int
  ): [Shift!]!
    @guard(with: ["api"])
    @paginate(defaultCount: 25, type: PAGINATOR, model: "App\\Models\\Shift")
    @whereAuthCompany
    @scope(name: "filterShifts", args: ["filter"])
}