   server {
       listen 443 ssl;
       server_name 0.0.0.0;

       ssl_certificate /etc/nginx/ssl/laravel-cert.pem;
       ssl_certificate_key /etc/nginx/ssl/laravel-key.pem;

       location / {
           proxy_pass http://laravel:8000; # Docker service de Laravel
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }
   }

   server {
       listen 8000;
       server_name 0.0.0.0;
       return 301 https://$host$request_uri;
   }
