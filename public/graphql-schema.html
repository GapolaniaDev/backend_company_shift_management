<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Schema Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #667eea;
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c66;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .schema-section {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .section-header {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }
        
        .section-header:hover {
            background: #e9ecef;
        }
        
        .section-header h3 {
            color: #495057;
            font-size: 1.3em;
        }
        
        .toggle-icon {
            font-size: 1.2em;
            transition: transform 0.3s;
        }
        
        .section-content {
            padding: 20px;
            display: none;
        }
        
        .section-content.active {
            display: block;
        }
        
        .field {
            background: #f8f9fa;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .field-name {
            font-weight: bold;
            color: #495057;
            font-size: 1.1em;
        }
        
        .field-type {
            color: #667eea;
            font-weight: 500;
        }
        
        .field-description {
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }
        
        .args {
            margin-top: 10px;
            padding-left: 20px;
        }
        
        .arg {
            background: white;
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
            border-left: 2px solid #28a745;
        }
        
        .type-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-label {
            opacity: 0.9;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 GraphQL Schema Explorer</h1>
            <p>Explora el esquema GraphQL de tu API Laravel</p>
        </div>
        
        <div class="content">
            <button class="refresh-btn" onclick="loadSchema()">🔄 Cargar Esquema</button>
            
            <div id="loading" class="loading">
                Cargando esquema GraphQL...
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
            
            <div id="stats" class="stats" style="display: none;"></div>
            
            <div id="schema-content" style="display: none;"></div>
        </div>
    </div>

    <script>
        async function loadSchema() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const stats = document.getElementById('stats');
            const content = document.getElementById('schema-content');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            stats.style.display = 'none';
            content.style.display = 'none';
            
            try {
                const introspectionQuery = `
                    query IntrospectionQuery {
                        __schema {
                            queryType { name }
                            mutationType { name }
                            subscriptionType { name }
                            types {
                                ...FullType
                            }
                        }
                    }
                    
                    fragment FullType on __Type {
                        kind
                        name
                        description
                        fields(includeDeprecated: true) {
                            name
                            description
                            args {
                                ...InputValue
                            }
                            type {
                                ...TypeRef
                            }
                            isDeprecated
                            deprecationReason
                        }
                        inputFields {
                            ...InputValue
                        }
                        interfaces {
                            ...TypeRef
                        }
                        enumValues(includeDeprecated: true) {
                            name
                            description
                            isDeprecated
                            deprecationReason
                        }
                        possibleTypes {
                            ...TypeRef
                        }
                    }
                    
                    fragment InputValue on __InputValue {
                        name
                        description
                        type { ...TypeRef }
                        defaultValue
                    }
                    
                    fragment TypeRef on __Type {
                        kind
                        name
                        ofType {
                            kind
                            name
                            ofType {
                                kind
                                name
                                ofType {
                                    kind
                                    name
                                    ofType {
                                        kind
                                        name
                                        ofType {
                                            kind
                                            name
                                            ofType {
                                                kind
                                                name
                                                ofType {
                                                    kind
                                                    name
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                `;
                
                const response = await fetch('/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: introspectionQuery })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.errors) {
                    throw new Error(result.errors.map(e => e.message).join(', '));
                }
                
                displaySchema(result.data.__schema);
                
            } catch (err) {
                console.error('Error loading schema:', err);
                error.innerHTML = `<strong>Error:</strong> ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        function displaySchema(schema) {
            const stats = document.getElementById('stats');
            const content = document.getElementById('schema-content');
            
            // Filtrar tipos del sistema
            const userTypes = schema.types.filter(type => 
                !type.name.startsWith('__') && 
                !['String', 'Int', 'Float', 'Boolean', 'ID'].includes(type.name)
            );
            
            const queries = schema.queryType ? 
                schema.types.find(t => t.name === schema.queryType.name)?.fields || [] : [];
            const mutations = schema.mutationType ? 
                schema.types.find(t => t.name === schema.mutationType.name)?.fields || [] : [];
            
            // Mostrar estadísticas
            stats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${userTypes.length}</div>
                    <div class="stat-label">Tipos Definidos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${queries.length}</div>
                    <div class="stat-label">Queries Disponibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${mutations.length}</div>
                    <div class="stat-label">Mutations Disponibles</div>
                </div>
            `;
            stats.style.display = 'grid';
            
            // Mostrar contenido del esquema
            let html = '';
            
            // Queries
            if (queries.length > 0) {
                html += createSection('Queries Disponibles', queries.map(field => 
                    createFieldHtml(field)
                ).join(''));
            }
            
            // Mutations
            if (mutations.length > 0) {
                html += createSection('Mutations Disponibles', mutations.map(field => 
                    createFieldHtml(field)
                ).join(''));
            }
            
            // Tipos personalizados
            const customTypes = userTypes.filter(type => type.kind === 'OBJECT' && type.fields);
            if (customTypes.length > 0) {
                html += createSection('Tipos de Objetos', customTypes.map(type => 
                    createTypeHtml(type)
                ).join(''));
            }
            
            // Enums
            const enums = userTypes.filter(type => type.kind === 'ENUM');
            if (enums.length > 0) {
                html += createSection('Enumeraciones', enums.map(type => 
                    createEnumHtml(type)
                ).join(''));
            }
            
            content.innerHTML = html;
            content.style.display = 'block';
            
            // Agregar eventos para colapsar/expandir secciones
            document.querySelectorAll('.section-header').forEach(header => {
                header.addEventListener('click', () => {
                    const content = header.nextElementSibling;
                    const icon = header.querySelector('.toggle-icon');
                    
                    if (content.classList.contains('active')) {
                        content.classList.remove('active');
                        icon.style.transform = 'rotate(0deg)';
                    } else {
                        content.classList.add('active');
                        icon.style.transform = 'rotate(90deg)';
                    }
                });
            });
        }
        
        function createSection(title, content) {
            return `
                <div class="schema-section">
                    <div class="section-header">
                        <h3>${title}</h3>
                        <span class="toggle-icon">▶</span>
                    </div>
                    <div class="section-content">
                        ${content}
                    </div>
                </div>
            `;
        }
        
        function createFieldHtml(field) {
            const args = field.args && field.args.length > 0 ? 
                `<div class="args">
                    <strong>Argumentos:</strong>
                    ${field.args.map(arg => 
                        `<div class="arg">
                            <strong>${arg.name}:</strong> ${typeToString(arg.type)}
                            ${arg.description ? `<br><em>${arg.description}</em>` : ''}
                        </div>`
                    ).join('')}
                </div>` : '';
                
            return `
                <div class="field">
                    <div class="field-name">
                        ${field.name}
                        <span class="type-badge">${typeToString(field.type)}</span>
                    </div>
                    ${field.description ? `<div class="field-description">${field.description}</div>` : ''}
                    ${args}
                </div>
            `;
        }
        
        function createTypeHtml(type) {
            return `
                <div class="field">
                    <div class="field-name">
                        ${type.name}
                        <span class="type-badge">Object</span>
                    </div>
                    ${type.description ? `<div class="field-description">${type.description}</div>` : ''}
                    <div class="args">
                        <strong>Campos:</strong>
                        ${type.fields.map(field => 
                            `<div class="arg">
                                <strong>${field.name}:</strong> ${typeToString(field.type)}
                                ${field.description ? `<br><em>${field.description}</em>` : ''}
                            </div>`
                        ).join('')}
                    </div>
                </div>
            `;
        }
        
        function createEnumHtml(type) {
            return `
                <div class="field">
                    <div class="field-name">
                        ${type.name}
                        <span class="type-badge">Enum</span>
                    </div>
                    ${type.description ? `<div class="field-description">${type.description}</div>` : ''}
                    <div class="args">
                        <strong>Valores:</strong>
                        ${type.enumValues.map(value => 
                            `<div class="arg">
                                <strong>${value.name}</strong>
                                ${value.description ? `<br><em>${value.description}</em>` : ''}
                            </div>`
                        ).join('')}
                    </div>
                </div>
            `;
        }
        
        function typeToString(type) {
            if (type.kind === 'NON_NULL') {
                return typeToString(type.ofType) + '!';
            }
            if (type.kind === 'LIST') {
                return '[' + typeToString(type.ofType) + ']';
            }
            return type.name || 'Unknown';
        }
        
        // Cargar el esquema automáticamente al cargar la página
        document.addEventListener('DOMContentLoaded', loadSchema);
    </script>
</body>
</html>
